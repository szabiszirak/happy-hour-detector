name: Helyek importja (OpenStreetMap)

# Az import-szkript módosításakor (vagy kézzel indítva) lekéri a négyszög kocsmáit,
# és a data/ mappába commitolja az eredményt.
on:
  push:
    branches: [main]
    paths:
      - scripts/import-osm.mjs
      - .github/workflows/import-osm.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/import-osm.mjs data
      - name: Eredmény commitolása
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nincs változás."
          else
            git commit -m "Helyek frissítése OpenStreetMap-ből"
            git push
          fi
