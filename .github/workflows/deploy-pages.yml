name: Demó közzététele (GitHub Pages)

# Minden main-re feltöltött változás után: tesztek, build, közzététel.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
      # Egész Budapest vektoros térképe (Protomaps / OpenStreetMap), hetente frissítve.
      - name: Térkép hete
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Budapest-térkép gyorsítótárból
        id: mapcache
        uses: actions/cache/restore@v4
        with:
          path: map-cache
          key: budapest-pmtiles-${{ steps.week.outputs.week }}
      - name: Budapest-térkép letöltése
        if: steps.mapcache.outputs.cache-hit != 'true'
        run: bash scripts/download-map.sh map-cache budapest
        continue-on-error: true # ha nem sikerül, az app a kis MVP-kivágásra vált
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Budapest-térkép mentése a gyorsítótárba
        if: steps.mapcache.outputs.cache-hit != 'true' && hashFiles('map-cache/budapest.pmtiles') != ''
        uses: actions/cache/save@v4
        with:
          path: map-cache
          key: budapest-pmtiles-${{ steps.week.outputs.week }}
      - name: Térkép a kiadásba
        run: |
          mkdir -p dist/map
          if [ -f map-cache/budapest.pmtiles ]; then cp map-cache/budapest.pmtiles map-cache/map-source.json dist/map/; fi
          ls -la dist/map
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
